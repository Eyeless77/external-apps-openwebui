apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-upstream
spec:
  interval: 5m
  chart:
    spec:
      chart: open-webui
      version: 14.5.0
      sourceRef:
        kind: HelmRepository
        name: openwebui
        namespace: external-openwebui
  values:
    replicaCount: {{ .Values.openwebui.replicaCount }}
    service:
      type: {{ .Values.openwebui.service.type }}
    ingress:
      enabled: {{ .Values.openwebui.ingress.enabled }}
      class: {{ .Values.openwebui.ingress.class | quote }}
      host: {{ .Values.openwebui.ingress.host | quote }}
      tls: {{ .Values.openwebui.ingress.tls }}
      annotations:
{{ toYaml .Values.openwebui.ingress.annotations | indent 8 }}
    persistence:
      enabled: {{ .Values.openwebui.persistence.enabled }}
      size: {{ .Values.openwebui.persistence.size | quote }}
    ollama:
      enabled: {{ .Values.openwebui.ollama.enabled }}
    pipelines:
      enabled: {{ .Values.openwebui.pipelines.enabled }}
