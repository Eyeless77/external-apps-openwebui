---
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: openwebui
spec:
  application:
    kind: OpenWebUI
    singular: openwebui
    plural: openwebuis
    openAPISchema: |
      {
        "title": "Chart Values",
        "type": "object",
        "properties": {
          "openwebui": {
            "description": "Open WebUI configuration.",
            "type": "object",
            "default": {},
            "required": [
              "ingress",
              "ollama",
              "persistence",
              "pipelines",
              "replicaCount",
              "service"
            ],
            "properties": {
              "ingress": {
                "description": "Ingress settings.",
                "type": "object",
                "default": {},
                "required": [
                  "annotations",
                  "class",
                  "enabled",
                  "tls"
                ],
                "properties": {
                  "annotations": {
                    "description": "Additional ingress annotations.",
                    "type": "object",
                    "default": {},
                    "x-kubernetes-preserve-unknown-fields": true
                  },
                  "class": {
                    "description": "IngressClass name (usually tenant name).",
                    "type": "string",
                    "default": ""
                  },
                  "enabled": {
                    "description": "Enable ingress.",
                    "type": "boolean",
                    "default": false
                  },
                  "host": {
                    "description": "Ingress host.",
                    "type": "string",
                    "default": ""
                  },
                  "tls": {
                    "description": "Enable TLS section generation.",
                    "type": "boolean",
                    "default": false
                  }
                }
              },
              "ollama": {
                "description": "Embedded Ollama chart toggle.",
                "type": "object",
                "default": {},
                "required": [
                  "enabled"
                ],
                "properties": {
                  "enabled": {
                    "description": "Enable component.",
                    "type": "boolean",
                    "default": false
                  }
                }
              },
              "persistence": {
                "description": "Storage settings.",
                "type": "object",
                "default": {},
                "required": [
                  "enabled",
                  "size"
                ],
                "properties": {
                  "enabled": {
                    "description": "Enable persistent volume claim.",
                    "type": "boolean",
                    "default": true
                  },
                  "size": {
                    "description": "Persistent volume size.",
                    "default": "10Gi",
                    "pattern": "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$",
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "string"
                      }
                    ],
                    "x-kubernetes-int-or-string": true
                  }
                }
              },
              "pipelines": {
                "description": "Embedded Pipelines chart toggle.",
                "type": "object",
                "default": {},
                "required": [
                  "enabled"
                ],
                "properties": {
                  "enabled": {
                    "description": "Enable component.",
                    "type": "boolean",
                    "default": true
                  }
                }
              },
              "replicaCount": {
                "description": "Number of replicas.",
                "type": "integer",
                "default": 1
              },
              "service": {
                "description": "Service settings.",
                "type": "object",
                "default": {},
                "required": [
                  "type"
                ],
                "properties": {
                  "type": {
                    "description": "Service type.",
                    "type": "string",
                    "default": "ClusterIP"
                  }
                }
              }
            }
          }
        }
      }
  release:
    chartRef:
      kind: HelmChart
      name: external-apps-openwebui-openwebui
      namespace: cozy-public
    labels:
      cozystack.io/ui: "true"
    prefix: openwebui-
  dashboard:
    category: AI
    singular: Open WebUI
    plural: Open WebUI Apps
    description: Self-hosted web interface for LLMs with built-in RAG and model integrations.
    tags:
      - ai
      - llm
      - webui
    icon: 
    keysOrder:
      - - apiVersion
      - - appVersion
      - - kind
      - - metadata
      - - metadata
        - name
      - - spec
        - openwebui
